name: Add Contributors

# pull_request_target runs this file from master with the base repo token.
# Check out master only. Do not check out or run the pull request head.
on:
  pull_request_target:
    types: [closed]
    branches: [master]
  # Maintainer backfill. Requires Actions write on this repo; not a pull_request trigger.
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username to credit (for example Aryan-theccool)
        required: true
        type: string
      types:
        description: Comma-separated contribution types, no spaces (for example bug,doc,test,code)
        required: true
        default: code
        type: string

concurrency:
  group: add-contributors-master
  cancel-in-progress: false

jobs:
  add-contributor:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # Persists the GITHUB_TOKEN (contents: write) so the push below can authenticate.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git author
        run: |
          # .all-contributorsrc sets commit:true, so all-contributors-cli runs
          # `git commit` itself. The runner has no user.name, and that commit
          # fails with "Author identity unknown" before the push step. The id
          # is github-actions[bot]'s user id so GitHub attributes the commit.
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine contribution types
        id: contrib
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Fetch the list of changed files from the PR
          CHANGED_FILES=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          TYPES=""

          # Check for security contributions (title or labels)
          if echo "$PR_TITLE" | grep -qi "security" || echo "$PR_LABELS" | grep -qi "security"; then
            TYPES="${TYPES},security"
          fi

          # Check for bug fix (title starts with "fix")
          if echo "$PR_TITLE" | grep -qiE "^fix"; then
            TYPES="${TYPES},bug"
          fi

          # Check changed files for contribution types
          HAS_DOC=false
          HAS_TRANSLATION=false
          HAS_TEST=false
          HAS_CODE=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              docs/*|*.md)
                HAS_DOC=true
                ;;
              messages/*)
                HAS_TRANSLATION=true
                ;;
              tests/*|*/tests/*|*/test_*)
                HAS_TEST=true
                ;;
              frontend/*|src/*)
                HAS_CODE=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$HAS_DOC" = true ]; then TYPES="${TYPES},doc"; fi
          if [ "$HAS_TRANSLATION" = true ]; then TYPES="${TYPES},translation"; fi
          if [ "$HAS_TEST" = true ]; then TYPES="${TYPES},test"; fi
          if [ "$HAS_CODE" = true ]; then TYPES="${TYPES},code"; fi

          # Default to "code" if nothing matched
          if [ -z "$TYPES" ]; then
            TYPES="code"
          else
            # Remove leading comma
            TYPES="${TYPES#,}"
          fi

          echo "types=$TYPES" >> "$GITHUB_OUTPUT"
          echo "Detected contribution types: $TYPES"

      - name: Add contributor
        id: add
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_USERNAME: ${{ github.event.pull_request.user.login }}
          PR_TYPES: ${{ steps.contrib.outputs.types }}
          # github.event.inputs is empty except on workflow_dispatch. The inputs
          # context itself is not available on pull_request_target.
          INPUT_USERNAME: ${{ github.event.inputs.username }}
          INPUT_TYPES: ${{ github.event.inputs.types }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            USERNAME="$INPUT_USERNAME"
            TYPES="$INPUT_TYPES"
          else
            USERNAME="$PR_USERNAME"
            TYPES="$PR_TYPES"
          fi

          if ! [[ "$USERNAME" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "Refusing username: ${USERNAME}"
            exit 1
          fi
          if ! [[ "$TYPES" =~ ^[A-Za-z]+(,[A-Za-z]+)*$ ]]; then
            echo "Refusing contribution types: ${TYPES}"
            exit 1
          fi

          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "Adding $USERNAME with types: $TYPES"

          # commit:true in .all-contributorsrc would make `add` commit and
          # leave this job with a clean index, so the push step would skip.
          # --no-commit keeps the edit in the worktree. The CLI is pinned to
          # the version that failed in run 39879235485.
          npx --yes all-contributors-cli@6.26.1 add "$USERNAME" "$TYPES" --no-commit
          npx --yes all-contributors-cli@6.26.1 generate

      - name: Commit and push if changed
        env:
          USERNAME: ${{ steps.add.outputs.username }}
        run: |
          git add .all-contributorsrc README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: add @${USERNAME} as contributor [skip ci]"
          fi

          # `add` commits on its own if --no-commit is ignored. That commit is
          # already on HEAD and is not staged, so a staged-diff check would
          # skip the push and the credit would never reach master.
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
            echo "No changes to push"
            exit 0
          fi

          if ! git log -1 --format=%B | grep -q '\[skip ci\]'; then
            git commit --amend --reset-author -m "docs: add @${USERNAME} as contributor [skip ci]"
          fi

          # Same refspec i18n-sync uses to push to master with contents: write.
          git push origin HEAD:master
