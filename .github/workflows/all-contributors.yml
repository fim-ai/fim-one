name: Add Contributors

# pull_request_target runs this file from master with the base repo token.
# Check out master only. Do not check out or run the pull request head.
on:
  pull_request_target:
    types: [closed]
    branches: [master]
  # Maintainer backfill. Requires Actions write on this repo; not a pull_request trigger.
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username to credit (for example Aryan-theccool)
        required: true
        type: string
      types:
        description: Comma-separated contribution types, no spaces (for example bug,doc,test,code)
        required: true
        default: code
        type: string

# Same group as i18n-sync, so only one of them pushes to master at a time.
# cancel-in-progress stays off. queue: max keeps every waiting run (the
# default queue drops an older pending run when a third one arrives).
concurrency:
  group: master-auto-push
  cancel-in-progress: false
  queue: max

jobs:
  add-contributor:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # Persists the GITHUB_TOKEN (contents: write) so the push below can authenticate.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git author
        run: |
          # .all-contributorsrc sets commit:true, so all-contributors-cli runs
          # `git commit` itself. The runner has no user.name, and that commit
          # fails with "Author identity unknown" before the push step. The id
          # is github-actions[bot]'s user id so GitHub attributes the commit.
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine contribution types
        id: contrib
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Fetch the list of changed files from the PR
          CHANGED_FILES=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          TYPES=""

          # Check for security contributions (title or labels)
          if echo "$PR_TITLE" | grep -qi "security" || echo "$PR_LABELS" | grep -qi "security"; then
            TYPES="${TYPES},security"
          fi

          # Check for bug fix (title starts with "fix")
          if echo "$PR_TITLE" | grep -qiE "^fix"; then
            TYPES="${TYPES},bug"
          fi

          # Check changed files for contribution types
          HAS_DOC=false
          HAS_TRANSLATION=false
          HAS_TEST=false
          HAS_CODE=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              docs/*|*.md)
                HAS_DOC=true
                ;;
              messages/*)
                HAS_TRANSLATION=true
                ;;
              tests/*|*/tests/*|*/test_*)
                HAS_TEST=true
                ;;
              frontend/*|src/*)
                HAS_CODE=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$HAS_DOC" = true ]; then TYPES="${TYPES},doc"; fi
          if [ "$HAS_TRANSLATION" = true ]; then TYPES="${TYPES},translation"; fi
          if [ "$HAS_TEST" = true ]; then TYPES="${TYPES},test"; fi
          if [ "$HAS_CODE" = true ]; then TYPES="${TYPES},code"; fi

          # Default to "code" if nothing matched
          if [ -z "$TYPES" ]; then
            TYPES="code"
          else
            # Remove leading comma
            TYPES="${TYPES#,}"
          fi

          echo "types=$TYPES" >> "$GITHUB_OUTPUT"
          echo "Detected contribution types: $TYPES"

      - name: Add contributor
        id: add
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_USERNAME: ${{ github.event.pull_request.user.login }}
          PR_TYPES: ${{ steps.contrib.outputs.types }}
          # github.event.inputs is empty except on workflow_dispatch. The inputs
          # context itself is not available on pull_request_target.
          INPUT_USERNAME: ${{ github.event.inputs.username }}
          INPUT_TYPES: ${{ github.event.inputs.types }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            USERNAME="$INPUT_USERNAME"
            TYPES="$INPUT_TYPES"
          else
            USERNAME="$PR_USERNAME"
            TYPES="$PR_TYPES"
          fi

          if ! [[ "$USERNAME" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "Refusing username: ${USERNAME}"
            exit 1
          fi
          if ! [[ "$TYPES" =~ ^[A-Za-z]+(,[A-Za-z]+)*$ ]]; then
            echo "Refusing contribution types: ${TYPES}"
            exit 1
          fi

          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"

          # all-contributors-cli 6.26.1 treats a shorter type list that overlaps
          # the current one as a removal (formatContributions). Passing
          # bug,doc,test,code for tao-hpu deleted maintenance, design,
          # projectManagement, ideas and infra, then the next merge appended
          # test, so every merge pushed a new commit. Only pass types that are
          # not already recorded. An already-complete contributor is a no-op.
          NEW_TYPES=$(python3 - "$USERNAME" "$TYPES" << 'PY'
          import json, sys
          username, types = sys.argv[1], sys.argv[2]
          wanted = [part for part in types.split(",") if part]
          with open(".all-contributorsrc", encoding="utf-8") as fh:
              config = json.load(fh)
          existing = []
          for contributor in config.get("contributors", []):
              login = str(contributor.get("login", ""))
              if login.lower() == username.lower():
                  existing = [str(item) for item in contributor.get("contributions", [])]
                  break
          have = {item.lower() for item in existing}
          print(",".join(part for part in wanted if part.lower() not in have))
          PY
          )
          echo "new_types=$NEW_TYPES" >> "$GITHUB_OUTPUT"
          if [ -z "$NEW_TYPES" ]; then
            echo "No new contribution types for @$USERNAME; not committing"
            exit 0
          fi

          echo "Adding $USERNAME with new types: $NEW_TYPES"
          # --no-commit keeps the edit in the worktree. The CLI is pinned to
          # the version that failed in run 39879235485.
          npx --yes all-contributors-cli@6.26.1 add "$USERNAME" "$NEW_TYPES" --no-commit
          npx --yes all-contributors-cli@6.26.1 generate

      - name: Commit and push if changed
        if: steps.add.outputs.new_types != ''
        env:
          USERNAME: ${{ steps.add.outputs.username }}
        run: |
          git add .all-contributorsrc README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: add @${USERNAME} as contributor [skip ci]"
          fi

          # Checkout starts at origin/master. Commits ahead of it were created
          # in this job (our commit, or the CLI if --no-commit was ignored).
          if [ "$(git rev-list --count origin/master..HEAD)" = "0" ]; then
            echo "No contributor commit to push"
            exit 0
          fi

          if ! git log -1 --format=%B | grep -q '\[skip ci\]'; then
            git commit --amend --reset-author -m "docs: add @${USERNAME} as contributor [skip ci]"
          fi

          attempt=1
          max=5
          while [ "$attempt" -le "$max" ]; do
            if git push origin HEAD:master; then
              echo "Pushed contributor commit"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/${max}); rebasing onto origin/master"
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::Could not rebase contributor commit onto origin/master"
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
              echo "Contributor commit already on origin/master"
              exit 0
            fi
            attempt=$((attempt + 1))
          done
          echo "::error::Failed to push contributor commit after ${max} attempts"
          exit 1
