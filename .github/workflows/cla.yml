name: CLA

# Contributors sign the CLA (CLA.md) by commenting on their pull request.
# Signatures are stored on the unprotected cla-signatures branch, so signing
# does not push to master or trigger the master workflows.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Minimum the action actually calls. Commit statuses are not used: the
# check result is the job itself (core.setFailed), not the Statuses API.
# `statuses: write` is intentionally omitted.
permissions:
  actions: write # re-run the failed CLA workflow after every committer signs
  contents: write # commit signatures/v1/cla.json on the cla-signatures branch
  pull-requests: write # read the pull request and post the signature comment

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/fim-ai/fim-one/blob/master/CLA.md
          branch: cla-signatures
          allowlist: tao-hpu,cursoragent,*[bot]
          lock-pullrequest-aftermerge: false
