name: i18n sync

# Auto-translates EN source files (messages/en/, docs/*.mdx, README.md) into
# ZH/JA/KO/DE/FR after any push to master. Acts as a safety net for contributor
# PRs that didn't run the pre-commit translation hook locally (no LLM_API_KEY).
#
# Idempotent: if the push already contains up-to-date translations (e.g. from
# a local hook run), this workflow detects no diff and exits silently.

on:
  push:
    branches: [master]
  # Maintainer backfill. Requires Actions write on this repo; not a pull_request trigger.
  workflow_dispatch:
    inputs:
      since:
        description: "Translate EN sources changed after this commit (exclusive), for example 6d7c0504"
        required: true
        type: string

# Same group as Add Contributors, so only one of them pushes to master at a
# time. cancel-in-progress stays off. queue: max keeps every waiting run.
# Waiting is not enough on its own: a push run checks out the triggering
# commit, which can be behind master by the time it pushes. The push step
# rebases onto origin/master and retries.
concurrency:
  group: master-auto-push
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    # Recursion is prevented by the [skip ci] marker in the auto-commit
    # message (natively honored by GitHub Actions push trigger).

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push events stay on the triggering commit so before..HEAD is that
          # push. Manual backfill checks out master, not a pull request head.
          persist-credentials: true
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.sha }}

      - name: Compute changed EN source files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$SINCE" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::since must be a 7-40 character commit SHA"
              exit 1
            fi
            BEFORE=$(git rev-parse --verify "${SINCE}^{commit}")
          else
            BEFORE="$PUSH_BEFORE"
            # First push to the branch: before is all zeros — diff against empty tree
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=$(git hash-object -t tree /dev/null)
            fi
          fi
          echo "Diff base: $BEFORE"

          # Locale subdir exclusion (docs/{zh,ja,...} are generated, not sources)
          LOCALE_EXCLUDE=""
          for d in frontend/messages/*/; do
            name=$(basename "$d")
            [ "$name" = "en" ] && continue
            if [ -z "$LOCALE_EXCLUDE" ]; then
              LOCALE_EXCLUDE="^docs/${name}/"
            else
              LOCALE_EXCLUDE="${LOCALE_EXCLUDE}|^docs/${name}/"
            fi
          done

          CHANGED=$(git diff --name-only --diff-filter=ACM "$BEFORE" HEAD \
            | grep -E '^(frontend/messages/en/.*\.json|docs/.*\.mdx|README\.md)$' || true)

          # docs.json nav sources (base metadata, template, glossary, overrides)
          NAV_CHANGED=$(git diff --name-only --diff-filter=ACM "$BEFORE" HEAD \
            | grep -E '^(docs/docs\.base\.json|docs/nav\.template\.json|scripts/docs-nav-glossary\.json|docs/nav-overrides/.+\.json)$' || true)
          if [ -n "$NAV_CHANGED" ]; then
            echo "nav_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nav_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$LOCALE_EXCLUDE" ] && [ -n "$CHANGED" ]; then
            CHANGED=$(echo "$CHANGED" | grep -vE "$LOCALE_EXCLUDE" || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No EN content source files changed in this push."
            echo "has_content_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed EN content sources:"
            echo "$CHANGED" | sed 's/^/  /'
            echo "has_content_changes=true" >> "$GITHUB_OUTPUT"
            # Use $'\n'-delimited list passed via file to handle paths with spaces safely
            echo "$CHANGED" > /tmp/changed-files.txt
          fi

          # Combined gate: install tooling/commit if either content OR nav changed
          if [ -n "$CHANGED" ] || [ -n "$NAV_CHANGED" ]; then
            echo "has_any_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_any_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.changes.outputs.has_any_changes == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.changes.outputs.has_any_changes == 'true'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.changes.outputs.has_content_changes == 'true'
        run: uv sync --all-extras

      - name: Regenerate docs/docs.json (nav + labels across 6 locales)
        if: steps.changes.outputs.nav_changed == 'true'
        run: |
          python3 scripts/build-docs-nav.py

      - name: Run translation (content)
        if: steps.changes.outputs.has_content_changes == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          FAST_LLM_MODEL: ${{ secrets.FAST_LLM_MODEL }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::LLM_API_KEY secret not set — cannot translate."
            echo "Set repo secret at Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Pass changed files via xargs to handle any volume; translate.py
          # accepts --files with a space-separated list.
          xargs -a /tmp/changed-files.txt uv run scripts/translate.py --files

      - name: Commit and push if anything changed
        if: steps.changes.outputs.has_any_changes == 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No translation diff — locales already up to date."
            exit 0
          fi

          git config user.name  "fim-one-bot"
          git config user.email "bot@fim.ai"

          git add docs frontend/messages README.md 'README.*.md' .translation-hashes.json
          if git diff --cached --quiet; then
            echo "No translation diff — locales already up to date."
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SUBJECT="since ${SINCE}"
          else
            SUBJECT="for ${GITHUB_SHA::8}"
          fi
          git commit -m "chore(i18n): sync translations ${SUBJECT} [skip ci]"

          # Another master push (Add Contributors, or a second translation)
          # can land while this job runs. Rebase onto the latest master and
          # retry a few times; a content conflict fails the job.
          attempt=1
          max=5
          while [ "$attempt" -le "$max" ]; do
            if git push origin HEAD:master; then
              echo "Pushed translation commit"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/${max}); rebasing onto origin/master"
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::Could not rebase translation commit onto origin/master"
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
              echo "Translation commit already on origin/master"
              exit 0
            fi
            attempt=$((attempt + 1))
          done
          echo "::error::Failed to push translations after ${max} attempts"
          exit 1
