name: Star History

# Self-owned star chart for README (assets/star-history.svg).
# Replaces the broken api.star-history.com live embed after GitHub's Jul 2026
# stargazer API restriction drained third-party token pools.
#
# Uses the workflow GITHUB_TOKEN (repo collaborator) to page stargazers,
# regenerates the SVG, and commits only when the file actually changes.
# Not live-per-view, but refreshes on a schedule with zero external deps.

on:
  schedule:
    # Twice daily UTC
    - cron: "17 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/gen_star_history.py"
      - ".github/workflows/star-history.yml"

concurrency:
  group: star-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Skip the bot's own commits (message contains [skip ci])
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need a token that can push; default GITHUB_TOKEN is fine for same-repo.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate star-history SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_star_history.py --repo "${{ github.repository }}"

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/star-history.svg; then
            echo "No change in assets/star-history.svg"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          git commit -m "$(cat <<'EOF'
          chore(readme): refresh star-history SVG [skip ci]

          Auto-generated by scripts/gen_star_history.py (workflow star-history.yml).
          EOF
          )"
          git push
