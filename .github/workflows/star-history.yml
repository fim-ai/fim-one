name: Star History

# Self-owned star chart for README (light + dark SVGs).
# Replaces the broken api.star-history.com live embed after GitHub's Jul 2026
# stargazer API restriction drained third-party token pools.
#
# Generate step uses STAR_HISTORY_TOKEN (user fine-grained PAT): the default
# Actions GITHUB_TOKEN gets 403 on /stargazers after GitHub's Jul 2026
# restriction. Checkout/push still use GITHUB_TOKEN (contents: write).
# README uses <picture prefers-color-scheme> so the chart matches GitHub UI.

on:
  schedule:
    # Twice daily UTC
    - cron: "17 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/gen_star_history.py"
      - ".github/workflows/star-history.yml"

concurrency:
  group: star-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Skip the bot's own commits (message contains [skip ci])
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need a token that can push; default GITHUB_TOKEN is fine for same-repo.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate star-history SVG
        env:
          # User PAT in repo secret STAR_HISTORY_TOKEN (no "Stargazers"
          # permission exists on fine-grained PATs; Metadata + repo access
          # is enough for public repos). Do not use secrets.GITHUB_TOKEN here.
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN }}
        run: python3 scripts/gen_star_history.py --repo "${{ github.repository }}"

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/star-history.svg assets/star-history-dark.svg; then
            echo "No change in star-history SVGs"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg assets/star-history-dark.svg
          git commit -m "$(cat <<'EOF'
          chore(readme): refresh star-history SVGs [skip ci]

          Auto-generated light + dark charts by scripts/gen_star_history.py.
          EOF
          )"
          git push
